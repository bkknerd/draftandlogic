# Decap CMS 3.8.4 (self-hosted in this folder). Set `repo` below before first use.
backend:
  name: github
  repo: YOUR-GITHUB-USER/draftandlogic
  branch: main

media_folder: static/uploads
public_folder: /uploads
site_url: https://draftandlogic.com
display_url: https://draftandlogic.com
locale: en

collections:
  - name: site
    label: Site content
    files:
      - name: launch
        label: Coming soon switch
        file: content/site/launch.json
        format: json
        fields:
          - { label: "Show the coming soon page (turn off to launch the full site)", name: comingSoon, widget: boolean, default: false, hint: "ON: the home page shows the coming soon page, the full site moves to /preview/ and search engines are blocked. OFF: the full site is live. Takes about a minute after you save." }
          - { label: Browser tab title, name: pageTitle, widget: string }
          - { label: Headline, first line (drawn, faded), name: line1, widget: string }
          - { label: Headline, second line (built, blinks to solid), name: line2, widget: string }
          - { label: Message, name: message, widget: text }
          - { label: Email field label, name: emailLabel, widget: string }
          - { label: Button, name: button, widget: string }
          - { label: Thank you message, name: thanks, widget: string }
          - { label: Error message, name: error, widget: string }
          - { label: Contact email (optional, leave empty to hide), name: contactEmail, widget: string, required: false }
          - { label: Text before the contact email, name: contactText, widget: string, required: false }
      - name: interface
        label: Small text (buttons, labels, form messages, 404 page)
        file: content/site/interface.json
        format: json
        fields:
          - { label: Skip link, name: skip, widget: string }
          - { label: Main menu screen reader label, name: navAria, widget: string }
          - { label: Case study link, name: viewCase, widget: string }
          - { label: Hero slider, left label, name: sliderLeft, widget: string }
          - { label: Hero slider, right label, name: sliderRight, widget: string }
          - { label: Hero slider screen reader label, name: sliderAria, widget: string }
          - { label: Hero slider spoken value (after the number), name: sliderValue, widget: string }
          - { label: Process mock, address bar, name: mockUrl, widget: string }
          - { label: Process mock, brief lines, name: mockLines, widget: list, summary: "{{fields.text}}", field: { label: Line, name: text, widget: string } }
          - { label: Process mock, four status lines, name: mockStates, widget: list, min: 4, max: 4, summary: "{{fields.text}}", field: { label: Status, name: text, widget: string } }
          - { label: Screenshot viewer label, name: shotsAria, widget: string }
          - { label: Screenshot viewer close button, name: close, widget: string }
          - { label: Cursor label on work images, name: cursor, widget: string }
          - { label: Back to top label, name: backToTop, widget: string }
          - { label: Case study page, badge, name: csBadge, widget: string }
          - { label: Case study page, back to work link, name: csBackWork, widget: string }
          - { label: Case study page, start a project link, name: csStart, widget: string }
          - { label: Case study page, stack heading, name: csStack, widget: string }
          - { label: Case study page, chapters label, name: csChapters, widget: string }
          - { label: Case study page, challenge label, name: csChallenge, widget: string }
          - { label: Case study page, solution label, name: csSolution, widget: string }
          - { label: Case study page, outcome label, name: csOutcome, widget: string }
          - { label: Case study page, results heading, name: csResults, widget: string }
          - { label: Case study page, try the demos button, name: csTryDemos, widget: string }
          - { label: Case study page, closing heading, name: csEndHeading, widget: string }
          - { label: Case study page, back to all work button, name: csBackAll, widget: string }
          - { label: Contact brief card, title, name: briefTitle, widget: string }
          - { label: Contact brief card, draft status, name: briefDraft, widget: string }
          - { label: Contact brief card, ready status, name: briefReady, widget: string }
          - { label: Contact brief card, To, name: briefTo, widget: string }
          - { label: Contact brief card, Re, name: briefRe, widget: string }
          - { label: Contact brief card, From, name: briefFrom, widget: string }
          - { label: Contact brief card, Brief, name: briefBody, widget: string }
          - { label: Form, empty fields message, name: formEmpty, widget: string }
          - { label: Form, invalid email message, name: formInvalid, widget: string }
          - { label: Form, sending message, name: formSending, widget: string }
          - { label: Form, thank you message, name: formSent, widget: string }
          - { label: Form, error message, name: formError, widget: string }
          - { label: 404 page, big heading, name: notFoundHeading, widget: string }
          - { label: 404 page, second line, name: notFoundAccent, widget: string }
          - { label: 404 page, text, name: notFoundText, widget: string }
          - { label: 404 page, button, name: notFoundButton, widget: string }
      - name: seo
        label: SEO and sharing
        file: content/site/seo.json
        format: json
        fields:
          - { label: Page title, name: title, widget: string, hint: "Aim for 50 to 60 characters. Search engines cut off the rest." }
          - { label: Search description, name: description, widget: text, hint: "Aim for 140 to 158 characters. Lead with what you build and who for.", pattern: ['^.{0,200}$', "Keep under 200 characters"] }
          - { label: Social share description, name: shareDescription, widget: text, hint: "Shown when the link is shared. Keep under 200 characters." }
          - { label: Company summary (llms.txt), name: orgIntro, widget: text, hint: "Plain-text summary that AI tools read. Facts only: what you build, on what, who owns what." }
          - { label: Topics (structured data), name: topics, widget: list, hint: "Subjects the studio is expert in. Shown to search engines, not on the page.", field: { label: Topic, name: topic, widget: string } }
      - name: nav
        label: Navigation
        file: content/site/nav.json
        format: json
        fields:
          - label: Links
            name: items
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Goes to, name: href, widget: select, options: ["#approach", "#stack", "#work", "#process", "#contact"] }
      - name: hero
        label: Hero
        file: content/site/hero.json
        format: json
        fields:
          - { label: Headline, name: line1, widget: string }
          - { label: Headline (second line), name: line2, widget: string }
          - { label: Intro, name: intro, widget: text }
          - { label: Button text, name: cta, widget: string }
      - name: partners
        label: Partner logos
        file: content/site/partners.json
        format: json
        fields:
          - { label: "Show this section on the site", name: show, widget: boolean, default: true, hint: "Turn off to hide this whole section and its menu link. Takes about a minute after you save." }
          - { label: Line above logos, name: line, widget: string }
          - label: Logos
            name: logos
            widget: list
            summary: "{{fields.alt}}"
            fields:
              - { label: Logo, name: image, widget: image }
              - { label: Name (alt text), name: alt, widget: string }
      - name: approach
        label: Approach
        file: content/site/approach.json
        format: json
        fields:
          - { label: "Show this section on the site", name: show, widget: boolean, default: true, hint: "Turn off to hide this whole section and its menu link. Takes about a minute after you save." }
          - { label: Heading, name: heading, widget: string }
          - label: Columns
            name: columns
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Tagline, name: how, widget: string }
              - { label: Text, name: text, widget: text }
      - name: services
        label: Services
        file: content/site/services.json
        format: json
        fields:
          - { label: "Show this section on the site", name: show, widget: boolean, default: true, hint: "Turn off to hide this whole section and its menu link. Takes about a minute after you save." }
          - { label: Heading, name: heading, widget: string }
          - { label: Intro, name: intro, widget: text }
          - label: Levels (seven, top to bottom; the count is fixed by the drawing)
            name: levels
            widget: list
            min: 7
            max: 7
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Bold lead-in, name: lead, widget: string }
              - { label: Text, name: text, widget: text }
      - name: work
        label: Work section
        file: content/site/work.json
        format: json
        fields:
          - { label: "Show this section on the site", name: show, widget: boolean, default: true, hint: "Turn off to hide this whole section and its menu link. Takes about a minute after you save." }
          - { label: "Show the other launched sites list", name: alsoShow, widget: boolean, default: true }
          - { label: Heading, name: heading, widget: string }
          - { label: Intro, name: intro, widget: text }
          - { label: Heading for other launches, name: alsoHeading, widget: string }
          - label: Other launched sites
            name: also
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Name, name: label, widget: string }
              - { label: Link, name: url, widget: string }
      - name: cases
        label: Work cards
        file: content/site/cases.json
        format: json
        fields:
          - label: Cards
            name: items
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Name, name: label, widget: string }
              - { label: Look, name: style, widget: select, options: [abx, namc, sum, iron, milo, happy], hint: "Picks the card's colour theme. New cards can reuse any of these." }
              - { label: Large card, name: feature, widget: boolean, default: false, required: false }
              - { label: Image on the right, name: reverse, widget: boolean, default: false, required: false }
              - { label: Case study ID, name: study, widget: string, required: false, hint: "summit, abaxent, namc, milo or happy. Leave empty for no case-study link." }
              - { label: Caption (cards without screenshots), name: note, widget: string, required: false }
              - label: Screenshots
                name: shots
                widget: list
                required: false
                summary: "{{fields.alt}}"
                fields:
                  - { label: Image, name: image, widget: image }
                  - { label: Description (alt text), name: alt, widget: string }
              - { label: Headline, name: title, widget: string }
              - { label: Summary, name: summary, widget: text }
      - name: process
        label: Process
        file: content/site/process.json
        format: json
        fields:
          - { label: "Show this section on the site", name: show, widget: boolean, default: true, hint: "Turn off to hide this whole section and its menu link. Takes about a minute after you save." }
          - { label: Heading, name: heading, widget: string }
          - { label: Why drawing first, name: why, widget: text }
          - label: Steps
            name: steps
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
      - name: faq
        label: FAQ (also feeds search and AI answers)
        file: content/site/faq.json
        format: json
        fields:
          - { label: "Show this section on the site", name: show, widget: boolean, default: true, hint: "Turn off to hide this whole section and its menu link. Takes about a minute after you save." }
          - { label: Heading, name: heading, widget: string }
          - label: Questions
            name: items
            widget: list
            summary: "{{fields.q}}"
            fields:
              - { label: Question, name: q, widget: string }
              - { label: Answer, name: a, widget: text, hint: "Plain sentences. Shown on the page and in search structured data." }
      - name: contact
        label: Contact form
        file: content/site/contact.json
        format: json
        fields:
          - { label: "Show this section on the site", name: show, widget: boolean, default: true, hint: "Turn off to hide this whole section and its menu link. Takes about a minute after you save." }
          - { label: Heading, name: heading, widget: string }
          - { label: Intro, name: intro, widget: string }
          - { label: Topic question, name: legend, widget: string }
          - label: Topic buttons (four, order is fixed)
            name: topics
            widget: list
            min: 4
            max: 4
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: "Message field label when this topic is picked", name: ml, widget: string }
          - { label: Name field label, name: nameLabel, widget: string }
          - { label: Email field label, name: emailLabel, widget: string }
          - { label: Message field label, name: messageLabel, widget: string }
          - { label: Send button, name: button, widget: string }
      - name: footer
        label: Footer
        file: content/site/footer.json
        format: json
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Copyright line, name: copyright, widget: string }

  - name: studies
    label: Case studies
    files:
      - &study
        name: summit
        label: Summit
        file: content/case-studies/summit.json
        format: json
        fields: &studyfields
          - { label: Title, name: title, widget: string }
          - { label: Tag line, name: tag, widget: string }
          - { label: Screenshot selector (do not change), name: shotSel, widget: hidden }
          - { label: Summary (lead), name: summaryLead, widget: text }
          - { label: Summary (more), name: summaryMore, widget: text }
          - { label: Chips, name: chips, widget: list, field: { label: Chip, name: chip, widget: string } }
          - label: Stack and architecture
            name: stack
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Detail, name: detail, widget: text }
          - label: Chapters
            name: chapters
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Interactive demo, name: demo, widget: select, options: [grain, score, type, sprite, intro, steps, edge, grid, sponsor, cal, patio, menu, pair, tab, climb, open], hint: "Demos are built into the site; choose which one this chapter shows." }
              - { label: Challenge, name: challenge, widget: text }
              - { label: Solution, name: solution, widget: text }
              - { label: Outcome, name: outcome, widget: text }
          - label: Headline numbers
            name: stats
            widget: list
            summary: "{{fields.value}} {{fields.label}}"
            fields:
              - { label: Number, name: value, widget: string }
              - { label: Label, name: label, widget: string }
          - label: Results and impact
            name: results
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
      - { name: abaxent, label: Abaxent, file: content/case-studies/abaxent.json, format: json, fields: *studyfields }
      - { name: namc, label: NAMC, file: content/case-studies/namc.json, format: json, fields: *studyfields }
      - { name: milo, label: "Milo's Cafe", file: content/case-studies/milo.json, format: json, fields: *studyfields }
      - { name: happy, label: "Happy's (concept)", file: content/case-studies/happy.json, format: json, fields: *studyfields }
