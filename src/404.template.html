<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>{{interface.notFoundHeading}} {{interface.notFoundAccent}} | {{footer.name}}</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Geist:wght@300..700&display=swap">
<style>:root{--bg:#D4FF3A;--fg:#0C0C0C}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:400 1.1rem/1.5 'Geist','Helvetica Neue',Arial,sans-serif;padding:24px}
main{max-width:60rem}h1{font:700 clamp(3.4rem,13vw,11rem)/.88 'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;letter-spacing:-.04em;margin:0 0 28px}h1 i{display:block;font-style:normal}
a{display:inline-block;background:var(--fg);color:var(--bg);padding:16px 28px;border-radius:999px;text-decoration:none;font-weight:500}a:focus-visible{outline:2px solid var(--fg);outline-offset:3px}</style></head>
<body><main><h1>{{interface.notFoundHeading}} <i>{{interface.notFoundAccent}}</i></h1><p>{{interface.notFoundText}}</p><a href="/">{{interface.notFoundButton}}</a></main></body></html>
