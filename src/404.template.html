<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>{{interface.notFoundHeading}} {{interface.notFoundAccent}} | {{footer.name}}</title>
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png"><link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png"><link rel="icon" href="/favicon-192.png" sizes="192x192" type="image/png"><link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest">
<style>:root{--bg:#D4FF3A;--fg:#0C0C0C}
{{{fontFaces}}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:400 1.1rem/1.5 'Helvetica Neue',Helvetica,Arial,sans-serif;padding:24px}
main{max-width:60rem}h1{font:700 clamp(3.4rem,13vw,11rem)/.88 'Matter','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:-.04em;margin:0 0 28px}h1 i{display:block;font-style:normal}
a{display:inline-block;background:var(--fg);color:var(--bg);padding:16px 28px;border-radius:999px;text-decoration:none;font-weight:500}a:focus-visible{outline:2px solid var(--fg);outline-offset:3px}</style></head>
<body><main><h1>{{interface.notFoundHeading}} <i>{{interface.notFoundAccent}}</i></h1><p>{{interface.notFoundText}}</p><a href="/">{{interface.notFoundButton}}</a></main></body></html>
