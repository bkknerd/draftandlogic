# Decap CMS 3.8.4 (self-hosted in this folder).
backend:
  name: github
  repo: bkknerd/draftandlogic
  branch: main

media_folder: public/uploads
public_folder: /uploads
site_url: https://draftandlogic.com
display_url: https://draftandlogic.com
locale: en

collections:
  - name: site
    label: Site content
    files:
      - name: interface
        label: Small text (case study labels, work filter, 404 page)
        file: content/site/interface.json
        format: json
        fields:
          - { label: Case study page, badge, name: csBadge, widget: string }
          - { label: Case study page, back to work link, name: csBackWork, widget: string }
          - { label: Case study page, features heading, name: csFeatures, widget: string }
          - { label: Case study page, numbers heading, name: csNumbers, widget: string }
          - { label: Case study page, built with heading, name: csBuilt, widget: string, required: false }
          - { label: Case study page, related work heading, name: csRelated, widget: string, required: false }
          - { label: Case study page, view case label, name: csViewCase, widget: string, required: false }
          - { label: Case study page, before and after heading, name: csCompare, widget: string, required: false }
          - { label: Case study page, before label, name: csBefore, widget: string, required: false }
          - { label: Case study page, after label, name: csAfter, widget: string, required: false }
          - { label: Case study page, impact heading, name: csImpact, widget: string, required: false }
          - { label: Work cards, featured label, name: featuredLabel, widget: string, required: false }
          - { label: Case study page, goals heading, name: csGoals, widget: string }
          - { label: Case study page, what we did heading, name: csDid, widget: string }
          - { label: Case study page, visit site button, name: csVisit, widget: string }
          - { label: Case study page, more work heading, name: csRelated, widget: string }
          - { label: Work filter, all label, name: filterAll, widget: string }
          - { label: Work filter, group label, name: filterLabel, widget: string }
          - { label: Case study page, back to all work button, name: csBackAll, widget: string }
          - { label: 404 page, big heading, name: notFoundHeading, widget: string }
          - { label: 404 page, second line, name: notFoundAccent, widget: string }
          - { label: 404 page, text, name: notFoundText, widget: string }
          - { label: 404 page, button, name: notFoundButton, widget: string }
      - name: analytics
        label: Google Analytics
        file: content/site/analytics.json
        format: json
        fields:
          - { label: "Turn Google Analytics on", name: enabled, widget: boolean, default: true, hint: "Visitors who send Do Not Track or Global Privacy Control are not measured." }
          - { label: "Measurement ID", name: measurementId, widget: string, pattern: ['^G-[A-Z0-9]{6,14}$', "Looks like G-XXXXXXXXXX"], hint: "From Google Analytics: Admin, Data streams, your stream." }
      - name: seo
        label: SEO and sharing
        file: content/site/seo.json
        format: json
        fields:
          - { label: Page title, name: title, widget: string, hint: "Aim for 50 to 60 characters. Search engines cut off the rest." }
          - { label: Search description, name: description, widget: text, hint: "Aim for 140 to 158 characters. Lead with what you build and who for.", pattern: ['^.{0,200}$', "Keep under 200 characters"] }
          - { label: Social share description, name: shareDescription, widget: text, hint: "Shown when the link is shared. Keep under 200 characters." }
          - { label: Company summary (llms.txt), name: orgIntro, widget: text, hint: "Plain-text summary that AI tools read. Facts only: what you build, on what, who owns what." }
          - { label: Topics (structured data), name: topics, widget: list, hint: "Subjects the studio is expert in. Shown to search engines, not on the page.", field: { label: Topic, name: topic, widget: string } }
      - name: nav
        label: Navigation
        file: content/site/nav.json
        format: json
        fields:
          - label: Links
            name: items
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Goes to, name: href, widget: select, options: ["#work", "#services", "#faq", "#contact", "/swoogo-development/"] }
      - name: hero
        label: Hero
        file: content/site/hero.json
        format: json
        fields:
          - { label: Small line above the headline, name: kicker, widget: string, required: false }
          - { label: Headline, name: line1, widget: string }
          - { label: Headline (second line), name: line2, widget: string }
          - { label: Intro, name: intro, widget: text }
          - { label: Button text, name: cta, widget: string }
          - { label: Second button text, name: cta2, widget: string }
          - { label: Status line (leave empty to hide), name: status, widget: string, required: false }
      - name: partners
        label: Partner logos
        file: content/site/partners.json
        format: json
        fields:
          - { label: "Show this section on the site", name: show, widget: boolean, default: true, hint: "Turn off to hide this whole section and its menu link. Takes about a minute after you save." }
          - { label: Line above logos, name: line, widget: string }
          - label: Logos
            name: logos
            widget: list
            summary: "{{fields.alt}}"
            fields:
              - { label: Logo, name: image, widget: image }
              - { label: Name (alt text), name: alt, widget: string }
      - name: services
        label: Services
        file: content/site/services.json
        format: json
        fields:
          - { label: "Show this section on the site", name: show, widget: boolean, default: true, hint: "Turn off to hide this whole section and its menu link. Takes about a minute after you save." }
          - { label: Section label, name: label, widget: string, required: false }
          - { label: Heading, name: heading, widget: string }
          - label: Levels (six, top to bottom; the count is fixed by the drawing)
            name: levels
            widget: list
            min: 6
            max: 6
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Description, name: lead, widget: string }
              - { label: Link text (optional), name: linkText, widget: string, required: false, hint: "Shown after the description, e.g. a link to a service page." }
              - { label: Link goes to (optional), name: linkHref, widget: string, required: false, hint: "A page on this site, e.g. /swoogo-development/" }
      - name: work
        label: Work section
        file: content/site/work.json
        format: json
        fields:
          - { label: "Show this section on the site", name: show, widget: boolean, default: true, hint: "Turn off to hide this whole section and its menu link. Takes about a minute after you save." }
          - { label: "Show the other launched sites list", name: alsoShow, widget: boolean, default: true }
          - { label: Heading, name: heading, widget: string }
          - { label: Intro, name: intro, widget: text }
          - label: Groups on the home page
            name: groups
            widget: list
            required: false
            summary: "{{fields.heading}}"
            hint: "The home page list splits into these groups, in this order. Give each work card and launched site a matching group ID."
            fields:
              - { label: Group ID, name: id, widget: string, hint: "venues or events" }
              - { label: Heading, name: heading, widget: string }
          - { label: Link text to the All work page, name: allLink, widget: string, required: false }
          - { label: All work page heading, name: allHeading, widget: string, required: false }
          - { label: "All work page title in search results (before | Draft & Logic)", name: allTitle, widget: string, required: false }
          - { label: All work page intro, name: allIntro, widget: text, required: false }
          - { label: Heading for other launches, name: alsoHeading, widget: string }
          - label: Other launched sites
            name: also
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Name, name: label, widget: string }
              - { label: Link, name: url, widget: string }
              - { label: Group ID, name: group, widget: string, required: false, hint: "venues or events" }
      - name: cases
        label: Work cards
        file: content/site/cases.json
        format: json
        fields:
          - label: Cards
            name: items
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Name, name: label, widget: string }
              - { label: Show on the home page, name: home, widget: boolean, default: false, required: false, hint: "Every card appears on the All work page." }
              - { label: Group ID, name: group, widget: string, required: false, hint: "venues or events. Sets which group the card sits in on the home page." }
              - { label: Featured case study, name: featured, widget: boolean, default: false, required: false, hint: "Leads the work list and spans the full row on the All work page. Turn it on for one project." }
              - { label: Case study ID, name: study, widget: string, required: false, hint: "nyias, summit, abaxent, namc, milo, nlt, happy or walkup. Leave empty for no case-study link." }
              - { label: Small tag on the card (optional, e.g. Concept), name: tag, widget: string, required: false }
              - label: Screenshots
                name: shots
                widget: list
                required: false
                summary: "{{fields.alt}}"
                fields:
                  - { label: Image, name: image, widget: image }
                  - { label: Description (alt text), name: alt, widget: string }
              - { label: Headline, name: title, widget: string }
              - { label: Summary, name: summary, widget: text }
              - { label: Services we delivered, name: services, widget: list, required: false, field: { label: Service, name: service, widget: string }, hint: "Shown as tags and used by the filter. Use the service names from the Services section exactly." }
      - name: faq
        label: FAQ (also feeds search and AI answers)
        file: content/site/faq.json
        format: json
        fields:
          - { label: "Show this section on the site", name: show, widget: boolean, default: true, hint: "Turn off to hide this whole section and its menu link. Takes about a minute after you save." }
          - { label: Heading, name: heading, widget: string }
          - label: Questions
            name: items
            widget: list
            summary: "{{fields.q}}"
            fields:
              - { label: Question, name: q, widget: string }
              - { label: Answer, name: a, widget: text, hint: "Plain sentences. Shown on the page and in search structured data." }
      - name: contact
        label: Contact section
        file: content/site/contact.json
        format: json
        fields:
          - { label: "Show this section on the site", name: show, widget: boolean, default: true, hint: "Turn off to hide this whole section and its menu link." }
          - { label: Heading, name: heading, widget: string }
          - { label: Text, name: intro, widget: string }
          - { label: "Button text (opens the visitor's email app, addressed to the email in Footer)", name: button, widget: string }
      - name: areas
        label: Local pages (web design in a town)
        file: content/site/areas.json
        format: json
        fields:
          - label: Pages
            name: items
            widget: list
            summary: "{{fields.city}}"
            fields:
              - { label: Town, name: city, widget: string }
              - { label: "Page address (lowercase, hyphens, e.g. web-design-apex-nc)", name: slug, widget: string, pattern: ['^[a-z0-9-]+$', "Lowercase letters, numbers and hyphens only"] }
              - { label: Heading, name: heading, widget: string }
              - { label: "Search description (140 to 158 characters)", name: description, widget: text, required: false, hint: "Leave empty to use the intro." }
              - { label: Intro, name: intro, widget: text, hint: "Say what is true for this town: where the studio is, which local clients you built for." }
              - { label: What you get, name: points, widget: list, field: { label: Point, name: point, widget: string } }
              - { label: "Body paragraphs (what's true for this town: local clients, how you work there)", name: body, widget: list, required: false, field: { label: Paragraph, name: paragraph, widget: text } }
              - label: Local questions
                name: faq
                widget: list
                required: false
                summary: "{{fields.q}}"
                fields:
                  - { label: Question, name: q, widget: string }
                  - { label: Answer, name: a, widget: text, hint: "Put the answer in the first sentence." }
              - { label: Case studies to show, name: cases, widget: list, field: { label: Case study ID, name: id, widget: string }, hint: "nyias, summit, abaxent, namc, milo, nlt, happy or walkup" }
      - name: studio
        label: Studio page
        file: content/site/studio.json
        format: json
        fields:
          - { label: "Show this page", name: show, widget: boolean, default: true }
          - { label: Heading, name: heading, widget: string }
          - { label: "Lead line (big, under the heading)", name: lead, widget: string, required: false }
          - { label: Intro, name: intro, widget: text }
          - { label: "Search description", name: description, widget: text, hint: "About 150 characters. Shown in Google results." }
          - label: "What we do"
            name: whatWeDo
            widget: object
            fields:
              - { label: "Statement (starts with Draft & Logic)", name: heading, widget: string }
              - { label: Text, name: text, widget: text }
              - label: Links
                name: links
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
          - { label: "Manifesto lines (one statement per line)", name: manifesto, widget: list, field: { label: Line, name: line, widget: string } }
          - { label: "Results: heading", name: statsHeading, widget: string }
          - { label: "Results: note", name: statsNote, widget: string, hint: "Say where the numbers come from." }
          - label: "Results"
            name: stats
            widget: list
            summary: "{{fields.value}} {{fields.label}}"
            hint: "A result only shows once it has a value. The section stays hidden until at least one does. Use real numbers from Google Analytics."
            fields:
              - { label: "Number (e.g. 48,000 or 32%)", name: value, widget: string, required: false }
              - { label: Label, name: label, widget: string }
          - { label: "How it goes: heading", name: processHeading, widget: string }
          - label: "How it goes: steps"
            name: steps
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Step, name: title, widget: string }
              - { label: Text, name: text, widget: string }
          - { label: "How we work: heading", name: valuesHeading, widget: string }
          - label: "How we work"
            name: values
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Line, name: title, widget: string }
              - { label: Text, name: text, widget: text }
          - { label: "Questions: heading", name: factsHeading, widget: string }
          - label: Questions
            name: facts
            widget: list
            summary: "{{fields.q}}"
            fields:
              - { label: Question, name: q, widget: string }
              - { label: Answer, name: a, widget: text }
      - name: privacy
        label: Privacy page
        file: content/site/privacy.json
        format: json
        fields:
          - { label: Heading, name: heading, widget: string }
          - { label: Last updated, name: updated, widget: string, required: false }
          - { label: Intro, name: intro, widget: text }
          - label: Sections
            name: sections
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
      - name: footer
        label: Footer
        file: content/site/footer.json
        format: json
        fields:
          - { label: Service area line, name: area, widget: string }
          - { label: Email, name: email, widget: string }
          - { label: Phone (for links and search, with +1), name: phone, widget: string }
          - { label: Phone (as shown), name: phoneDisplay, widget: string }
          - { label: Google Business Profile link (used in search schema only, not shown on the page), name: gbpUrl, widget: string, required: false }
          - { label: GitHub link (structured data), name: github, widget: string, required: false }
          - { label: Founder name (structured data), name: founderName, widget: string, required: false }
          - { label: Founder title, name: founderTitle, widget: string, required: false }
          - { label: Founder LinkedIn, name: founderLinkedin, widget: string, required: false }
          - { label: Name, name: name, widget: string }
          - { label: Copyright line, name: copyright, widget: string }
          - label: Service page links
            name: serviceLinks
            widget: list
            required: false
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Goes to (a page on this site), name: href, widget: string }

  - name: studies
    label: Case studies
    files:
      - &study
        name: summit
        label: Summit
        file: content/case-studies/summit.json
        format: json
        fields: &studyfields
          - { label: Title, name: title, widget: string }
          - { label: Tag line, name: tag, widget: string }
          - { label: "Search title (before | Draft & Logic, under 45 characters)", name: seoTitle, widget: string, required: false, hint: "What the page is and where, e.g. Café website, Morrisville, NC. Leave empty to use the title." }
          - { label: "Backup summary (the page opens with the Work card's summary; this is used only if that is empty)", name: summaryLead, widget: text }
          - { label: "Client story (3 to 5 sentences, who they are, what they needed, what we built)", name: story, widget: text }
          - { label: Website address (adds a Visit site link), name: url, widget: string, required: false }
          - label: White paper or write-up (adds a link beside Visit site)
            name: paper
            widget: object
            required: false
            collapsed: true
            fields:
              - { label: Link text, name: label, widget: string, required: false, default: White paper (PDF) }
              - { label: PDF file, name: file, widget: file, required: false }
          - { label: "Layout (editorial = full-bleed hero, big statement, oversized section titles)", name: layout, widget: select, options: ["", "editorial"], required: false }
          - { label: "Editorial: statement (one paragraph, about 70 words)", name: statement, widget: text, required: false }
          - { label: "Editorial: brief (short paragraph before the closing line)", name: brief, widget: text, required: false }
          - { label: "Editorial: closing line", name: closing, widget: string, required: false }
          - { label: "Editorial: built with", name: platforms, widget: list, required: false, field: { label: Item, name: item, widget: string } }
          - { label: "Numbers heading (optional)", name: numbersHeading, widget: string, required: false }
          - label: "Editorial: back end section"
            name: cms
            widget: object
            required: false
            fields:
              - { label: Title, name: title, widget: string, required: false }
              - { label: Label, name: label, widget: string, required: false }
              - { label: Intro, name: intro, widget: text, required: false }
              - { label: Features, name: items, widget: list, required: false, field: { label: Feature, name: item, widget: string } }
              - label: Screenshots
                name: shots
                widget: list
                required: false
                summary: "{{fields.caption}}"
                fields:
                  - { label: Screenshot, name: image, widget: image }
                  - { label: Description, name: alt, widget: string, required: false }
                  - { label: Caption, name: caption, widget: string, required: false }
                  - { label: "Half width (pairs with the next half-width shot)", name: half, widget: boolean, required: false, default: false }
          - { label: Client colour (rules and markers on the case page), name: accent, widget: color, required: false }
          - label: By the numbers
            name: numbers
            widget: list
            required: false
            hint: "Only add real results, such as conversion rate or load time. Leave empty to hide the block."
            summary: "{{fields.value}} {{fields.label}}"
            fields:
              - { label: Number, name: value, widget: string }
              - { label: "Before (optional, shown struck through under the number)", name: before, widget: string, required: false }
              - { label: Label, name: label, widget: string }
          - { label: "Numbers footnote (how and when they were measured)", name: numbersNote, widget: text, required: false }
          - label: Before and after
            name: compare
            widget: list
            required: false
            hint: "The old and new site at 1440 desktop and 390 phone, full screens, nothing cropped. Leave empty to hide the block."
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Before screenshot, desktop, name: before, widget: image }
              - { label: Before screenshot, phone, name: beforeMobile, widget: image, required: false }
              - { label: Before description, name: beforeAlt, widget: string, required: false }
              - { label: Before caption, name: beforeNote, widget: text, required: false }
              - { label: After screenshot, desktop, name: after, widget: image }
              - { label: After screenshot, phone, name: afterMobile, widget: image, required: false }
              - { label: After description, name: afterAlt, widget: string, required: false }
              - { label: After caption, name: afterNote, widget: text, required: false }
          - { label: "Impact intro (say whether these are projected or measured)", name: impactNote, widget: string, required: false }
          - label: What it should move
            name: impact
            widget: list
            required: false
            hint: "A research figure, what it means for this site, and the source. Leave empty to hide the block."
            summary: "{{fields.value}}"
            fields:
              - { label: Figure, name: value, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Source, name: source, widget: string, required: false }
              - { label: Source link, name: url, widget: string, required: false }
          - { label: Goals, name: goals, widget: list, required: false, field: { label: Goal, name: goal, widget: string } }
          - label: Client quote
            name: quote
            widget: object
            required: false
            hint: "Leave empty to hide the quote."
            fields:
              - { label: Quote, name: text, widget: text, required: false }
              - { label: Name, name: name, widget: string, required: false }
              - { label: Role, name: role, widget: string, required: false }
          - label: Features
            name: features
            widget: list
            summary: "{{fields.title}}"
            hint: "A short title and a screenshot or recording. The first one is shown full width."
            fields:
              - { label: Title (shown under the image), name: title, widget: string }
              - { label: Screenshot, name: image, widget: image, required: false, hint: "Any shape works. A phone capture is shown narrow; a whole-page capture scrolls inside its frame." }
              - { label: "Screen recording (optional, MP4; shown instead of the screenshot)", name: video, widget: file, required: false }
              - { label: Screenshot description, name: alt, widget: string, required: false }
      - { name: abaxent, label: Abaxent, file: content/case-studies/abaxent.json, format: json, fields: *studyfields }
      - { name: namc, label: NAMC, file: content/case-studies/namc.json, format: json, fields: *studyfields }
      - { name: milo, label: "Milo's Cafe", file: content/case-studies/milo.json, format: json, fields: *studyfields }
      - { name: nlt, label: New Life Tabernacle, file: content/case-studies/nlt.json, format: json, fields: *studyfields }
      - { name: happy, label: "Happy's (concept)", file: content/case-studies/happy.json, format: json, fields: *studyfields }
      - { name: nyias, label: "New York International Auto Show", file: content/case-studies/nyias.json, format: json, fields: *studyfields }
      - { name: walkup, label: "The WalkUp (concept)", file: content/case-studies/walkup.json, format: json, fields: *studyfields }
